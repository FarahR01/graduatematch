name: '🔍 Git Flow Validation'

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate-commits:
    name: '📝 Validate Commit Messages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: commitlint.config.js

  validate-branch-naming:
    name: '🌿 Validate Branch Naming'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming convention
        run: |
          branch_name="${{ github.head_ref }}"
          echo "Validating branch: $branch_name"
          
          # Valid patterns: feature/*, hotfix/*, release/v*, develop, main
          if [[ "$branch_name" =~ ^(feature\/[a-z0-9-]+|hotfix\/[a-z0-9-]+|release\/v[0-9]+\.[0-9]+\.[0-9]+|develop|main)$ ]]; then
            echo "✅ Branch name '$branch_name' follows conventions"
          else
            echo "❌ Branch name '$branch_name' does not follow conventions"
            echo "Valid patterns:"
            echo "  - feature/descriptive-name"
            echo "  - hotfix/descriptive-name" 
            echo "  - release/vX.Y.Z"
            echo "  - develop"
            echo "  - main"
            exit 1
          fi

  check-atomic-commits:
    name: '⚛️ Analyze Commit Atomicity'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze commit size and focus
        run: |
          echo "📊 Analyzing commit atomicity..."
          
          # Get commits in PR
          commits=$(git rev-list --reverse origin/${{ github.base_ref }}..origin/${{ github.head_ref }})
          
          for commit in $commits; do
            echo "🔍 Analyzing commit: $(git log --oneline -1 $commit)"
            
            # Count files changed
            files_changed=$(git show --name-only --pretty=format: $commit | wc -l)
            
            # Count lines changed (insertions + deletions)
            lines_stats=$(git show --stat --pretty=format: $commit | tail -1)
            
            echo "  📁 Files changed: $files_changed"
            echo "  📏 $lines_stats"
            
            # Warn about large commits
            if [ $files_changed -gt 10 ]; then
              echo "  ⚠️  Warning: Large commit affecting $files_changed files"
              echo "     Consider breaking into smaller, atomic commits"
            fi
            
            # Check for mixed concerns (dangerous patterns)
            file_list=$(git show --name-only --pretty=format: $commit)
            
            has_backend=$(echo "$file_list" | grep -c "apps/backend/" || true)
            has_frontend=$(echo "$file_list" | grep -c "apps/web/" || true)  
            has_docs=$(echo "$file_list" | grep -c "apps/docs/\|README\|\.md$" || true)
            has_config=$(echo "$file_list" | grep -c "\.json$\|\.yaml$\|\.yml$\|\.js$\|\.ts$" | head -1)
            
            concerns=0
            [ $has_backend -gt 0 ] && ((concerns++))
            [ $has_frontend -gt 0 ] && ((concerns++))
            [ $has_docs -gt 0 ] && ((concerns++))
            
            if [ $concerns -gt 1 ]; then
              echo "  ⚠️  Warning: Commit touches multiple application areas"
              echo "     Backend: $has_backend, Frontend: $has_frontend, Docs: $has_docs"
              echo "     Consider splitting into focused, atomic commits"
            fi
            
            echo ""
          done

  build-and-test:
    name: '🧪 Build & Test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Lint codebase
        run: pnpm lint

  pr-quality-gate:
    name: '🚪 PR Quality Gate'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-commits, validate-branch-naming, check-atomic-commits, build-and-test]
    steps:
      - name: Quality Gate Summary
        run: |
          echo "🎉 All quality gates passed!"
          echo "✅ Commit messages follow conventions"
          echo "✅ Branch naming follows standards" 
          echo "✅ Commits analyzed for atomicity"
          echo "✅ Build and tests successful"
          echo ""
          echo "This PR is ready for human review! 🚀"