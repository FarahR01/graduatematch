
services:
  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgres:15.10-alpine3.21
    container_name: graduatematch_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-graduatematch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-graduatematch_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graduatematch -d graduatematch_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ================================
  # Redis Cache
  # ================================
  redis:
    image: redis:7.4.2-alpine3.21
    container_name: graduatematch_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ================================
  # Backend API
  # ================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: graduatematch_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USERNAME:-graduatematch}:${DB_PASSWORD:-secure_password}@postgres:5432/${DB_NAME:-graduatematch_dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-graduatematch}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password}
      DB_NAME: ${DB_NAME:-graduatematch_dev}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ================================
  # Backend Development (override)
  # ================================
  backend-dev:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder
    container_name: graduatematch_backend_dev
    profiles:
      - dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://graduatematch:secure_password@postgres:5432/graduatematch_dev
      JWT_SECRET: dev_secret_key
      JWT_REFRESH_SECRET: dev_refresh_secret_key
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:ro
    command: ["pnpm", "--filter", "@graduatematch/backend", "start:dev"]
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: graduatematch_network